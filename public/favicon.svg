<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f15" />
      <stop offset="100%" stop-color="#1a1a24" />
    </linearGradient>
    <linearGradient id="insta-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#405de6" />
      <stop offset="25%" stop-color="#833ab4" />
      <stop offset="50%" stop-color="#e1306c" />
      <stop offset="75%" stop-color="#f56040" />
      <stop offset="100%" stop-color="#fcaf45" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Circle Background -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-grad)" stroke="url(#insta-border)" stroke-width="16" />

  <!-- Monogram JC Script Text -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;display=swap');
    .script-text {
      font-family: 'Great Vibes', 'MonteCarlo', 'Pinyon Script', cursive, sans-serif;
      font-size: 260px;
      font-weight: 400;
      fill: url(#insta-border);
      text-anchor: middle;
      dominant-baseline: central;
      filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.6));
    }
  </style>

  <text x="256" y="270" class="script-text">JC</text>
</svg>
